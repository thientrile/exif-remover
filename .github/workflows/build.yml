name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version (single source exif_remover.__version__)
        run: |
          $v = python -c "import exif_remover; print(exif_remover.__version__)"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "tag $env:GITHUB_REF_NAME does not match __version__ $v"
          }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Fetch bundled tools (pinned, SHA256-checked)
        run: python scripts/fetch_tools.py

      - name: Unit tests (Windows, bundled tools)
        run: python -m unittest discover -s tests -v

      - name: Install GUI build deps
        run: pip install -r requirements-gui.txt

      - name: GUI tests (stop, backup-folder guard, misnamed files, error reasons)
        run: python -m unittest discover -s tests -p test_gui.py -v

      - name: GUI screenshots (demo folder C:\demo\photos; 1920x1080 full-screen ones for the Store)
        continue-on-error: true
        timeout-minutes: 4
        run: |
          New-Item -ItemType Directory shots, shots\store | Out-Null
          python scripts/screenshot.py shots shots\store

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: screenshots
          path: shots/*.png

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: store-screenshots
          path: shots/store/*.png

      - name: Package (PyInstaller onedir)
        run: |
          python scripts/version_info.py version_info.txt
          pyinstaller --noconfirm --onedir --windowed --name StarVeil --icon assets/icon.ico `
          --version-file version_info.txt --add-data "tools;tools" --add-data "assets;assets" `
          --collect-data customtkinter --collect-all tkinterdnd2 exif_remover_gui.py

      - name: Installer (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Same file under the old name: the updater of v0.2.x looks only for ExifRemover-Setup-<v>.exe.
          Copy-Item "dist\StarVeil-Setup-$env:VERSION.exe" "dist\ExifRemover-Setup-$env:VERSION.exe"

      - name: Smoke test (install, clean a GPS JPEG with a non-ASCII name, check backup, GUI starts)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $app = "$env:RUNNER_TEMP\app"
          Start-Process "dist\StarVeil-Setup-$env:VERSION.exe" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$app`""
          $exe = "$app\StarVeil.exe"
          $t = "$app\_internal\tools"
          if (!(Test-Path $exe)) { throw "installer did not create $exe" }
          $vi = (Get-Item $exe).VersionInfo
          if ($vi.ProductVersion -ne $env:VERSION -or $vi.LegalCopyright -notmatch 'thientrile') { throw "exe version info: $($vi | Out-String)" }
          if (!(Test-Path "$app\LICENSE") -or !(Test-Path "$app\THIRD_PARTY_NOTICES.md")) { throw "LICENSE/notices not installed" }
          $d = "$env:RUNNER_TEMP\smoke"
          New-Item -ItemType Directory $d | Out-Null
          & "$t\ffmpeg.exe" -v error -f lavfi -i color=red:s=16x16 -frames:v 1 "$d\a.jpg"
          & "$t\exiftool.exe" -q -overwrite_original '-GPSLatitude=48.8' '-GPSLatitudeRef=N' '-Make=Canon' "$d\a.jpg"
          if (-not (& "$t\exiftool.exe" -s -GPSLatitude "$d\a.jpg")) { throw "fixture has no GPS" }
          Rename-Item "$d\a.jpg" "ảnh GPS.jpg"
          $p = Start-Process $exe -ArgumentList "`"$d`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "app exited with $($p.ExitCode)" }
          $bak = Get-ChildItem $env:RUNNER_TEMP -Directory -Filter 'smoke_backup-*'
          if (@($bak).Count -ne 1 -or !(Test-Path "$($bak.FullName)\ảnh GPS.jpg")) { throw "backup missing" }
          Rename-Item "$d\ảnh GPS.jpg" "a.jpg"
          $left = & "$t\exiftool.exe" -s -GPSLatitude -Make "$d\a.jpg"
          if ($left) { throw "metadata left: $left" }
          $gui = Start-Process $exe -PassThru
          Start-Sleep 8
          if ($gui.HasExited) { throw "GUI exited at start with code $($gui.ExitCode)" }
          Stop-Process -Id $gui.Id
          Write-Host "smoke OK: GPS and Make removed, backup at $($bak.FullName), GUI starts"

      - name: MSIX (Store package), test-signed install, clean a file via the alias, packaged mode
        env:
          # Partner Center > Product identity; until the owner sets these repo variables, placeholders are used.
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/msix.py msix
          $kit = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\makeappx.exe" | Sort-Object FullName | Select-Object -Last 1).DirectoryName
          $msix = "dist\StarVeil-$env:VERSION.0-x64.msix"
          & "$kit\makeappx.exe" pack /o /d msix /p $msix | Select-Object -Last 3
          # The release keeps the unsigned package (the Store signs it); a test-signed copy is installed here.
          $id = ([xml](Get-Content msix\AppxManifest.xml -Encoding utf8)).Package.Identity
          $cert = New-SelfSignedCertificate -Type Custom -Subject $id.Publisher -KeyUsage DigitalSignature `
            -CertStoreLocation Cert:\CurrentUser\My -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          Export-Certificate -Cert $cert -FilePath test.cer | Out-Null
          Import-Certificate -FilePath test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Copy-Item $msix test.msix
          & "$kit\signtool.exe" sign /q /fd SHA256 /sha1 $cert.Thumbprint test.msix
          Add-AppxPackage test.msix
          $pkg = Get-AppxPackage -Name $id.Name
          if (!$pkg) { throw "package not installed" }
          $long = Get-ChildItem $pkg.InstallLocation -Recurse -File | Sort-Object { $_.FullName.Length } | Select-Object -Last 1
          Write-Host "installed at $($pkg.InstallLocation); longest path $($long.FullName.Length) chars: $($long.FullName)"
          # Clean a GPS JPEG in a deep folder through the execution alias: exiftool runs from inside WindowsApps.
          $t = "tools"
          # Fixture tools get ASCII paths (exiftool reads its arguments in the ANSI code page); the app gets ảnh.jpg.
          $d = "$env:RUNNER_TEMP\msix\" + ('deep folder\' * 6)
          New-Item -ItemType Directory $d -Force | Out-Null
          & "$t\ffmpeg.exe" -v error -f lavfi -i color=red:s=16x16 -frames:v 1 "$d\a.jpg"
          & "$t\exiftool.exe" -q -overwrite_original '-GPSLatitude=48.8' '-GPSLatitudeRef=N' '-Make=Canon' "$d\a.jpg"
          Rename-Item "$d\a.jpg" "ảnh.jpg"
          $alias = "$env:LOCALAPPDATA\Microsoft\WindowsApps\starveil.exe"
          if (!(Test-Path "$env:LOCALAPPDATA\Microsoft\WindowsApps\exif-remover.exe")) { throw "exif-remover.exe alias missing" }
          $p = Start-Process $alias -ArgumentList '--no-backup', "`"$d`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "packaged app exited with $($p.ExitCode)" }
          Rename-Item "$d\ảnh.jpg" "a.jpg"
          $left = & "$t\exiftool.exe" -s -GPSLatitude -Make "$d\a.jpg"
          if ($left) { throw "metadata left after packaged run: $left" }
          # GUI from the Start menu entry; its log must say it knows it is packaged (updater off).
          Start-Process "shell:AppsFolder\$($pkg.PackageFamilyName)!StarVeil"
          Start-Sleep 10
          $gui = Get-Process StarVeil -ErrorAction SilentlyContinue
          if (!$gui) { throw "packaged GUI is not running" }
          $log = Get-ChildItem "$env:LOCALAPPDATA\ExifRemover\logs\app.log", "$env:LOCALAPPDATA\Packages\$($pkg.PackageFamilyName)\LocalCache\Local\ExifRemover\logs\app.log" -ErrorAction SilentlyContinue |
            Select-String 'start .*Store package'
          if (!$log) { throw "packaged GUI did not log 'Store package' (updater may still be on)" }
          $gui | Stop-Process
          Remove-AppxPackage $pkg.PackageFullName
          Write-Host "msix OK: $msix installs, cleans via alias, GUI starts in packaged mode ($($log[-1].Line))"

      - name: SHA256SUMS.txt
        run: |
          $files = "StarVeil-Setup-$env:VERSION.exe", "ExifRemover-Setup-$env:VERSION.exe", "StarVeil-$env:VERSION.0-x64.msix"
          $lines = foreach ($n in $files) { "$((Get-FileHash "dist\$n" -Algorithm SHA256).Hash.ToLower())  $n" }
          Set-Content -Path dist\SHA256SUMS.txt -Value $lines -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: StarVeil-${{ env.VERSION }}
          path: |
            dist/StarVeil-Setup-${{ env.VERSION }}.exe
            dist/StarVeil-${{ env.VERSION }}.0-x64.msix
            dist/SHA256SUMS.txt
            msix/Assets/StoreTile300.png

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_notes.py $env:GITHUB_REF_NAME notes.md
          gh release create $env:GITHUB_REF_NAME "dist\StarVeil-Setup-$env:VERSION.exe" "dist\ExifRemover-Setup-$env:VERSION.exe" `
            "dist\StarVeil-$env:VERSION.0-x64.msix" dist\SHA256SUMS.txt --title "Tinh Ảnh (StarVeil) $env:GITHUB_REF_NAME" --notes-file notes.md

      - name: Check release assets (installers, msix, SHA256SUMS.txt)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $names = gh release view $env:GITHUB_REF_NAME --json assets --jq '.assets[].name'
          foreach ($want in "StarVeil-Setup-$env:VERSION.exe", "ExifRemover-Setup-$env:VERSION.exe", "StarVeil-$env:VERSION.0-x64.msix", 'SHA256SUMS.txt') {
            if ($names -notcontains $want) { throw "release lacks $want (has: $names)" }
          }
          Write-Host "release assets OK: $names"

  update-e2e:
    # Installs the previous release, lets it update itself to this one, checks the installed version.
    # The previous release's updater looks for ExifRemover-Setup-<v>.exe (v0.2.x) or StarVeil-Setup-<v>.exe (1.0+).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install previous release, self-update, verify
        run: |
          $cur = $env:GITHUB_REF_NAME
          $tags = gh release list -R $env:GITHUB_REPOSITORY --limit 10 --json tagName --jq '.[].tagName'
          $prev = @($tags | Where-Object { $_ -ne $cur })[0]
          if (-not $prev -or $prev -eq 'v0.1.0') { Write-Host "skip: previous release ($prev) has no updater"; exit 0 }
          gh release download $prev -R $env:GITHUB_REPOSITORY -p 'ExifRemover-Setup-*.exe' -D prev
          $app = "$env:RUNNER_TEMP\app"
          Start-Process (Get-ChildItem prev\*.exe).FullName -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$app`""
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{D9BBF5CF-7048-4CE3-9E04-B8D59A5EDA2E}_is1'
          $before = (Get-ItemProperty $key).DisplayVersion
          if ("v$before" -ne $prev) { throw "installed $before, expected $prev" }
          # backups.json and settings must survive the rename (same %APPDATA%\ExifRemover folder).
          $cfg = "$env:APPDATA\ExifRemover"
          New-Item -ItemType Directory $cfg -Force | Out-Null
          Set-Content "$cfg\backups.json" '[{"path": "C:\\x_backup-2026-01-01", "source": "C:\\x", "created": "2026-01-01"}]' -Encoding utf8
          $old = @("$app\StarVeil.exe", "$app\ExifRemover.exe" | Where-Object { Test-Path $_ })[0]
          Start-Process $old -ArgumentList '--self-update' -Wait
          $want = $cur.TrimStart('v')
          for ($i = 0; $i -lt 60; $i++) {
            $now = (Get-ItemProperty $key).DisplayVersion
            if ($now -eq $want) { break }
            Start-Sleep 5
          }
          if ($now -ne $want) { throw "after self-update: $now, expected $want" }
          Start-Sleep 5
          if (!(Test-Path "$app\StarVeil.exe")) { throw "StarVeil.exe missing after update" }
          if (Test-Path "$app\ExifRemover.exe") { throw "old ExifRemover.exe left after update" }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Exif Remover.lnk") { throw "old Start menu shortcut left" }
          if (!(Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Tinh Ảnh (StarVeil).lnk")) { throw "new Start menu shortcut missing" }
          if (!(Select-String -Path "$cfg\backups.json" -Pattern 'x_backup-2026-01-01' -Quiet)) { throw "backups.json lost" }
          Write-Host "update OK: $prev -> $cur in $app"
